<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Gramite · Things I Like</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff1a1a;
            --primary-soft: #ff3333;
            --primary-glow: rgba(255, 26, 26, 0.35);
            --dark: #0c0c10;
            --darker: #07070a;
            --card-bg: #16161e;
            --card-hover: #1f1f2a;
            --border-dim: #2a2a36;
            --text-main: #f0f0f8;
            --text-muted: #9494a3;
            --gold: #ffd700;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 70px;
            background-image: radial-gradient(circle at 30% 10%, #1a0e0e 0%, #0c0c10 80%);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--darker); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            background: rgba(7, 7, 10, 0.92);
            backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-dim);
            z-index: 100;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title i {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 14px;
        }

        .header-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s;
            padding: 4px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-action-btn:hover {
            color: var(--primary);
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 16px 20px;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 30px 20px 20px;
            position: relative;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--primary), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 8px auto 0;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-dim);
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
        }

        .stat-item:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }

        .stat-item .number {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-item .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            position: relative;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 18px 10px 44px;
            border-radius: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* ===== CATEGORIES ===== */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0 16px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 8px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: 40px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
        }

        .category-btn:hover {
            border-color: var(--primary-soft);
            color: var(--text-main);
        }

        .category-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .category-btn .count {
            font-size: 10px;
            background: rgba(255,255,255,0.15);
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 4px;
        }

        .category-btn.active .count {
            background: rgba(255,255,255,0.25);
        }

        /* ===== GRID ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-dim);
            transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--primary-soft);
            box-shadow: 0 8px 30px rgba(255, 26, 26, 0.08);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 16/10;
            overflow: hidden;
            position: relative;
            background: var(--darker);
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img img {
            transform: scale(1.05);
        }

        .card-img .like-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
            z-index: 5;
        }

        .card-img .like-btn:hover {
            transform: scale(1.1);
        }

        .card-img .like-btn.liked {
            color: var(--primary);
        }

        .card-img .like-btn.liked i {
            font-weight: 900;
        }

        .card-img .badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            z-index: 5;
        }

        .card-content {
            padding: 16px 18px;
        }

        .card-content h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-content h3 .category-tag {
            font-size: 10px;
            font-weight: 600;
            color: var(--primary);
            background: rgba(255, 26, 26, 0.1);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .rating {
            color: var(--gold);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .rating .empty-star {
            color: var(--text-muted);
            opacity: 0.3;
        }

        .card-content p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: rgba(255, 26, 26, 0.08);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: var(--primary);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .empty-state h3 {
            color: var(--text-main);
            margin-bottom: 6px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 30px 0 10px;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid var(--border-dim);
            margin-top: 30px;
        }

        .footer i {
            color: var(--primary);
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--darker);
            border-top: 1px solid var(--border-dim);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 12px;
            backdrop-filter: blur(12px);
            max-width: 100%;
            margin: 0 auto;
            z-index: 200;
            padding-bottom: calc(12px + var(--safe-bottom));
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            gap: 3px;
            transition: 0.2s;
            cursor: pointer;
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .nav-item i {
            font-size: 22px;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .nav-item:hover {
            color: white;
        }

        /* ===== MESSAGE BOX ===== */
        .msg-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 999;
        }

        .msg-box {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            max-width: 340px;
            width: 90%;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .msg-box .icon-big {
            background: var(--primary);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin: 0 auto 10px;
        }

        .msg-box h3 { font-size: 20px; font-weight: 700; }
        .msg-box p { color: var(--text-muted); font-size: 14px; margin: 6px 0 14px; }

        .msg-box .btn-close {
            background: var(--primary);
            border: none;
            border-radius: 40px;
            padding: 10px 40px;
            font-weight: 600;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .stats-bar { gap: 20px; }
            .stat-item .number { font-size: 18px; }
            .grid { grid-template-columns: 1fr; }
            .search-bar { flex-direction: column; }
            .search-box { min-width: 100%; }
        }

        @media (max-width: 480px) {
            .header-title { font-size: 17px; }
            .hero h1 { font-size: 1.6rem; }
            .categories { gap: 8px; }
            .category-btn { font-size: 12px; padding: 6px 14px; }
            .card-content h3 { font-size: 1rem; }
            .card-content p { font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="header-title"><i class="fas fa-heart" style="color:var(--primary);"></i> Things I Like</div>
        <div class="header-actions">
            <!-- Stats icon - NOW LINKABLE to stats.html -->
            <a href="stats.html" class="header-action-btn" title="View your stats">
                <i class="fas fa-chart-simple"></i>
            </a>
            <a href="profile.html" class="header-action-btn"><i class="fas fa-user"></i></a>
        </div>
    </div>

    <!-- ===== CONTAINER ===== -->
    <div class="container">

        <!-- ===== HERO ===== -->
        <div class="hero">
            <h1>❤️ Things I Like</h1>
            <p class="subtitle">A collection of my favorite things — from hobbies and interests to foods and destinations</p>
        </div>

        <!-- ===== STATS BAR ===== -->
        <div class="stats-bar">
            <a href="stats.html" class="stat-item">
                <div class="number" id="totalCount">6</div>
                <div class="label">Total Items</div>
            </a>
            <a href="stats.html" class="stat-item">
                <div class="number" id="likedCount">3</div>
                <div class="label">Liked</div>
            </a>
            <a href="stats.html" class="stat-item">
                <div class="number">4.7</div>
                <div class="label">Avg Rating</div>
            </a>
        </div>

        <!-- ===== SEARCH ===== -->
        <div class="search-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search your likes..." id="searchInput">
            </div>
        </div>

        <!-- ===== CATEGORIES ===== -->
        <div class="categories" id="categoriesContainer">
            <button class="category-btn active" data-category="all">All <span class="count">6</span></button>
            <button class="category-btn" data-category="music">🎵 Music <span class="count">1</span></button>
            <button class="category-btn" data-category="food">🍕 Food <span class="count">2</span></button>
            <button class="category-btn" data-category="travel">✈️ Travel <span class="count">1</span></button>
            <button class="category-btn" data-category="books">📚 Books <span class="count">1</span></button>
            <button class="category-btn" data-category="art">🎨 Art <span class="count">1</span></button>
        </div>

        <!-- ===== GRID ===== -->
        <div class="grid" id="gridContainer">
            <!-- Cards will be rendered by JS -->
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <p>Made with <i class="fas fa-heart"></i> | Share your favorite things too!</p>
        </div>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <a href="Home.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="searching .html" class="nav-item"><i class="fas fa-search"></i><span>Discover</span></a>
        <a href="marketplace.html" class="nav-item"><i class="fas fa-store"></i><span>Marketplace</span></a>
        <a href="chating.html" class="nav-item"><i class="fas fa-message"></i><span>Messages</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i><span>Profile</span></a>
    </div>

    <!-- ===== MESSAGE BOX ===== -->
    <div class="msg-overlay" id="msgOverlay" onclick="hideMsg()"></div>
    <div class="msg-box" id="msgBox">
        <div class="icon-big"><i class="fas fa-bolt"></i></div>
        <h3 id="msgTitle">✨</h3>
        <p id="msgText">Hello</p>
        <button class="btn-close" onclick="hideMsg()">Got it</button>
    </div>

    <script>
        // ===== DATA =====
        const items = [
            { id: 1, title: 'Indie Rock Music', category: 'music', rating: 5, description: 'There\'s something about indie rock that speaks to my soul. The raw emotion, creative instrumentation, and authentic lyrics make it my go-to genre.', image: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80', tags: ['Music', 'Art'], liked: true },
            { id: 2, title: 'Specialty Coffee', category: 'food', rating: 4.5, description: 'I love exploring different coffee beans and brewing methods. The ritual of making coffee is almost as enjoyable as drinking it.', image: 'https://images.unsplash.com/photo-1489599851395-2e636569c976?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80', tags: ['Food & Drink', 'Ritual'], liked: false },
            { id: 3, title: 'Mountain Hiking', category: 'travel', rating: 5, description: 'There\'s nothing like reaching a mountain summit after a challenging hike. The views, the fresh air, and the sense of accomplishment are unbeatable.', image: 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80', tags: ['Travel', 'Adventure', 'Nature'], liked: true },
            { id: 4, title: 'Fantasy Novels', category: 'books', rating: 4, description: 'Getting lost in a well-crafted fantasy world is my favorite escape. I love stories with rich world-building and complex characters.', image: 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80', tags: ['Books', 'Fantasy'], liked: false },
            { id: 5, title: 'Street Photography', category: 'art', rating: 4.5, description: 'Capturing candid moments of everyday life in the city is my passion. Each photo tells a unique story of human experience.', image: 'https://images.unsplash.com/photo-1598940603846-a1edd0ef2574?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80', tags: ['Art', 'Hobby'], liked: true },
            { id: 6, title: 'Italian Cuisine', category: 'food', rating: 5, description: 'From making fresh pasta to perfecting pizza dough, I love cooking Italian food. The simplicity and freshness of ingredients create amazing flavors.', image: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80', tags: ['Food', 'Cooking'], liked: false },
        ];

        let currentCategory = 'all';
        let searchQuery = '';

        // ===== RENDER =====
        function renderItems() {
            const grid = document.getElementById('gridContainer');
            const filtered = items.filter(item => {
                const matchCategory = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                   item.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                   item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="fas fa-heart-broken"></i>
                        <h3>No items found</h3>
                        <p>Try adjusting your search or filter</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="card" data-id="${item.id}">
                    <div class="card-img">
                        <img src="${item.image}" alt="${item.title}" loading="lazy" />
                        <button class="like-btn ${item.liked ? 'liked' : ''}" onclick="toggleLike(${item.id})">
                            <i class="${item.liked ? 'fas' : 'far'} fa-heart"></i>
                        </button>
                        <span class="badge">${item.category.charAt(0).toUpperCase() + item.category.slice(1)}</span>
                    </div>
                    <div class="card-content">
                        <h3>
                            ${item.title}
                            <span class="category-tag">${item.category}</span>
                        </h3>
                        <div class="rating">${renderStars(item.rating)}</div>
                        <p>${item.description}</p>
                        <div class="tags">
                            ${item.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');

            updateStats();
        }

        function renderStars(rating) {
            let html = '';
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5;
            for (let i = 0; i < 5; i++) {
                if (i < full) {
                    html += '<i class="fas fa-star"></i>';
                } else if (i === full && half) {
                    html += '<i class="fas fa-star-half-alt"></i>';
                } else {
                    html += '<i class="far fa-star empty-star"></i>';
                }
            }
            return html;
        }

        // ===== TOGGLE LIKE =====
        function toggleLike(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.liked = !item.liked;
                renderItems();
                showMsg(
                    item.liked ? '❤️ Liked!' : '💔 Unliked',
                    item.liked ? `You added "${item.title}" to your likes.` : `You removed "${item.title}" from your likes.`
                );
            }
        }

        // ===== UPDATE STATS =====
        function updateStats() {
            document.getElementById('totalCount').textContent = items.length;
            document.getElementById('likedCount').textContent = items.filter(i => i.liked).length;
        }

        // ===== FILTER =====
        function filterByCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            renderItems();
        }

        // ===== SEARCH =====
        document.getElementById('searchInput').addEventListener('input', function() {
            searchQuery = this.value;
            renderItems();
        });

        // ===== CATEGORY CLICKS =====
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                filterByCategory(this.dataset.category);
            });
        });

        // ===== MESSAGE BOX =====
        function showMsg(title, text) {
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBox').style.display = 'block';
            document.getElementById('msgOverlay').style.display = 'block';
        }

        function hideMsg() {
            document.getElementById('msgBox').style.display = 'none';
            document.getElementById('msgOverlay').style.display = 'none';
        }

        // ===== NAVIGATION =====
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#')) {
                    e.preventDefault();
                    showMsg('🚀 Navigating', `Going to ${this.querySelector('span')?.textContent || 'page'}...`);
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });

        // ===== HEADER ACTIONS =====
        document.querySelectorAll('.header-action-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href) {
                    e.preventDefault();
                    const label = this.querySelector('i')?.className || 'page';
                    showMsg('🔗', `Opening ${label}...`);
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });

        // ===== STATS BAR ITEMS (now linkable) =====
        document.querySelectorAll('.stat-item').forEach(item => {
            item.addEventListener('click', function(e) {
                // Let the href handle navigation
                // Just show a message before navigating
                const href = this.getAttribute('href');
                if (href) {
                    e.preventDefault();
                    showMsg('📊 Stats', 'Viewing your detailed statistics...');
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });

        // ===== INIT =====
        renderItems();
        console.log('❤️ Things I Like page loaded. Stats icon is linkable to stats.html');
        console.log('📊 Click the chart icon or any stat card to go to the Stats page.');
    </script>

</body>
</html>
