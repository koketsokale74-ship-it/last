<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Gramite · Create Status</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff1a1a;
            --primary-soft: #ff3333;
            --primary-glow: rgba(255, 26, 26, 0.4);
            --dark: #0c0c10;
            --darker: #07070a;
            --card-bg: #16161e;
            --card-hover: #1f1f2a;
            --border-dim: #2a2a36;
            --text-main: #f0f0f8;
            --text-muted: #9494a3;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 30% 10%, #1a0e0e 0%, #0c0c10 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-wrapper {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--darker); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 20px;
            border-bottom: 1px solid var(--border-dim);
            margin-bottom: 20px;
        }

        .header .back-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            transition: 0.25s;
            padding: 4px;
            text-decoration: none;
        }

        .header .back-btn:hover {
            color: var(--primary);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title i {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s;
            padding: 4px;
        }

        .header-action-btn:hover {
            color: var(--primary);
        }

        /* ===== STATUS PREVIEW ===== */
        .status-preview {
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-md);
            padding: 30px 20px 20px;
            text-align: center;
            margin-bottom: 24px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: 0.3s;
        }

        .status-preview.has-content {
            min-height: 320px;
        }

        .status-preview .preview-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            object-fit: cover;
            margin-bottom: 12px;
        }

        .status-preview .preview-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .status-preview .preview-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .status-preview .preview-content {
            margin-top: 16px;
            font-size: 18px;
            line-height: 1.6;
            word-wrap: break-word;
            max-width: 100%;
        }

        .status-preview .preview-content .emoji-big {
            font-size: 56px;
            display: block;
            margin-bottom: 10px;
        }

        .status-preview .preview-media {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin-top: 10px;
        }

        .status-preview .preview-placeholder {
            color: var(--text-muted);
            font-size: 14px;
        }

        .status-preview .preview-placeholder i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        /* ===== STATUS OPTIONS ===== */
        .status-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .status-option {
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-sm);
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        .status-option:hover {
            border-color: var(--primary-soft);
            background: var(--card-hover);
            transform: translateY(-3px);
        }

        .status-option.active {
            border-color: var(--primary);
            background: rgba(255, 26, 26, 0.08);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .status-option i {
            font-size: 28px;
            color: var(--primary);
            display: block;
            margin-bottom: 6px;
        }

        .status-option .option-label {
            font-size: 12px;
            font-weight: 600;
        }

        .status-option .option-desc {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            margin-bottom: 20px;
        }

        .input-area textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            resize: vertical;
            min-height: 80px;
            outline: none;
            transition: border-color 0.3s;
            line-height: 1.5;
        }

        .input-area textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .input-area textarea::placeholder {
            color: var(--text-muted);
        }

        .input-area .char-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ===== MEDIA UPLOAD ===== */
        .media-upload-area {
            display: none;
            background: var(--card-bg);
            border: 2px dashed var(--border-dim);
            border-radius: var(--radius-sm);
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .media-upload-area:hover {
            border-color: var(--primary-soft);
            background: var(--card-hover);
        }

        .media-upload-area i {
            font-size: 40px;
            color: var(--primary);
            opacity: 0.5;
            display: block;
            margin-bottom: 8px;
        }

        .media-upload-area p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .media-upload-area .file-name {
            color: var(--text-main);
            font-weight: 500;
            margin-top: 6px;
        }

        /* ===== VISIBILITY ===== */
        .visibility-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
        }

        .visibility-row .label {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .visibility-row .label i {
            color: var(--primary);
        }

        .visibility-row .visibility-select {
            background: var(--darker);
            border: 1px solid var(--border-dim);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .visibility-row .visibility-select option {
            background: var(--darker);
        }

        /* ===== POST BUTTON ===== */
        .post-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .post-btn:hover {
            background: #e60000;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--primary-glow);
        }

        .post-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== MESSAGE BOX ===== */
        .msg-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 999;
        }

        .msg-box {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            max-width: 340px;
            width: 90%;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .msg-box .icon-big {
            background: var(--primary);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin: 0 auto 10px;
        }

        .msg-box h3 { font-size: 20px; font-weight: 700; }
        .msg-box p { color: var(--text-muted); font-size: 14px; margin: 6px 0 14px; }

        .msg-box .btn-close {
            background: var(--primary);
            border: none;
            border-radius: 40px;
            padding: 10px 40px;
            font-weight: 600;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .header-title { font-size: 17px; }
            .status-preview { padding: 20px 16px; min-height: 200px; }
            .status-preview .preview-avatar { width: 56px; height: 56px; }
            .status-preview .preview-content { font-size: 16px; }
            .status-options { gap: 8px; }
            .status-option { padding: 14px 8px; }
            .status-option i { font-size: 22px; }
            .status-option .option-label { font-size: 11px; }
            .input-area textarea { font-size: 14px; min-height: 60px; }
            .post-btn { font-size: 14px; padding: 12px; }
        }

        @media (max-width: 360px) {
            .status-options { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <a href="chating.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="header-title"><i class="fas fa-circle-plus"></i> Create Status</div>
            <div class="header-actions">
                <button class="header-action-btn" onclick="showMsg('ℹ️ Info', 'Share what\'s on your mind. Your status will disappear after 24 hours.')"><i class="fas fa-info-circle"></i></button>
            </div>
        </div>

        <!-- ===== STATUS PREVIEW ===== -->
        <div class="status-preview" id="statusPreview">
            <img src="https://storage.googleapis.com/a1aa/image/JApZbFwotxIlMx2gvX24bqvWTX4boKhIdRCvzIPdWRdZs39E.jpg" alt="Your Avatar" class="preview-avatar" />
            <div class="preview-name">Your Status</div>
            <div class="preview-time" id="previewTime">Just now</div>
            <div class="preview-content" id="previewContent">
                <div class="preview-placeholder">
                    <i class="fas fa-pen"></i>
                    Write something or add media...
                </div>
            </div>
        </div>

        <!-- ===== STATUS OPTIONS ===== -->
        <div class="status-options">
            <button class="status-option active" data-type="text" onclick="selectOption('text')">
                <i class="fas fa-pen"></i>
                <div class="option-label">Text</div>
                <div class="option-desc">Write a status</div>
            </button>
            <button class="status-option" data-type="photo" onclick="selectOption('photo')">
                <i class="fas fa-image"></i>
                <div class="option-label">Photo</div>
                <div class="option-desc">Upload image</div>
            </button>
            <button class="status-option" data-type="video" onclick="selectOption('video')">
                <i class="fas fa-video"></i>
                <div class="option-label">Video</div>
                <div class="option-desc">Upload video</div>
            </button>
        </div>

        <!-- ===== TEXT INPUT ===== -->
        <div class="input-area" id="textInputArea">
            <textarea id="statusText" placeholder="What's on your mind?" maxlength="200" oninput="updatePreview()"></textarea>
            <div class="char-count"><span id="charCount">0</span> / 200</div>
        </div>

        <!-- ===== MEDIA UPLOAD AREA ===== -->
        <div class="media-upload-area" id="mediaUploadArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Tap to choose a file</p>
            <div class="file-name" id="fileName"></div>
            <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;" onchange="handleFileUpload(this)" />
        </div>

        <!-- ===== VISIBILITY ===== -->
        <div class="visibility-row">
            <span class="label"><i class="fas fa-globe"></i> Visible to</span>
            <select class="visibility-select" id="visibilitySelect">
                <option value="all">🌍 Everyone</option>
                <option value="friends">👥 Friends</option>
                <option value="close">⭐ Close Friends</option>
            </select>
        </div>

        <!-- ===== POST BUTTON ===== -->
        <button class="post-btn" id="postBtn" onclick="postStatus()">
            <i class="fas fa-paper-plane"></i> Share Status
        </button>

    </div>

    <!-- ===== MESSAGE BOX ===== -->
    <div class="msg-overlay" id="msgOverlay" onclick="hideMsg()"></div>
    <div class="msg-box" id="msgBox">
        <div class="icon-big"><i class="fas fa-bolt"></i></div>
        <h3 id="msgTitle">✨</h3>
        <p id="msgText">Hello</p>
        <button class="btn-close" onclick="hideMsg()">Got it</button>
    </div>

    <script>
        // ===== STATE =====
        let selectedType = 'text';
        let mediaFile = null;
        let mediaDataURL = null;

        // ===== DOM REFS =====
        const statusText = document.getElementById('statusText');
        const charCount = document.getElementById('charCount');
        const previewContent = document.getElementById('previewContent');
        const previewTime = document.getElementById('previewTime');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const mediaUploadArea = document.getElementById('mediaUploadArea');
        const postBtn = document.getElementById('postBtn');

        // ===== UPDATE TIME =====
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            previewTime.textContent = timeStr;
        }
        updateTime();
        setInterval(updateTime, 30000);

        // ===== SELECT OPTION =====
        function selectOption(type) {
            selectedType = type;
            document.querySelectorAll('.status-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.type === type);
            });

            // Show/hide input areas
            document.getElementById('textInputArea').style.display = type === 'text' ? 'block' : 'none';
            document.getElementById('mediaUploadArea').style.display = type === 'text' ? 'none' : 'block';

            // Reset preview
            if (type === 'text') {
                updatePreview();
            } else if (type === 'photo' || type === 'video') {
                if (mediaDataURL) {
                    showMediaPreview(mediaDataURL, type);
                } else {
                    previewContent.innerHTML = `
                        <div class="preview-placeholder">
                            <i class="fas fa-${type === 'photo' ? 'image' : 'video'}"></i>
                            ${type === 'photo' ? 'Add a photo' : 'Add a video'}
                        </div>
                    `;
                }
            }
        }

        // ===== UPDATE TEXT PREVIEW =====
        function updatePreview() {
            const text = statusText.value.trim();
            const count = statusText.value.length;
            charCount.textContent = count;

            if (text) {
                const emojiMatch = text.match(/^([\u{1F600}-\u{1F9FF}\u{2600}-\u{27BF}\u{1F300}-\u{1F5FF}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}\u{2B50}\u{2764}\u{1F004}]+)$/u);
                if (emojiMatch && text.length <= 4) {
                    previewContent.innerHTML = `<span class="emoji-big">${text}</span>`;
                } else {
                    previewContent.innerHTML = text;
                }
            } else {
                previewContent.innerHTML = `
                    <div class="preview-placeholder">
                        <i class="fas fa-pen"></i>
                        Write something or add media...
                    </div>
                `;
            }
        }

        // ===== SHOW MEDIA PREVIEW =====
        function showMediaPreview(dataURL, type) {
            const mediaType = type || selectedType;
            if (mediaType === 'photo') {
                previewContent.innerHTML = `<img src="${dataURL}" alt="Photo" class="preview-media" />`;
            } else if (mediaType === 'video') {
                previewContent.innerHTML = `
                    <video class="preview-media" controls style="max-height:200px;border-radius:var(--radius-sm);">
                        <source src="${dataURL}" />
                        Your browser does not support the video tag.
                    </video>
                `;
            }
        }

        // ===== HANDLE FILE UPLOAD =====
        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            mediaFile = file;
            fileName.textContent = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                mediaDataURL = e.target.result;
                const type = file.type.startsWith('image/') ? 'photo' : 'video';
                selectedType = type;

                // Update option active state
                document.querySelectorAll('.status-option').forEach(opt => {
                    opt.classList.toggle('active', opt.dataset.type === type);
                });

                // Show correct input area
                document.getElementById('textInputArea').style.display = 'none';
                document.getElementById('mediaUploadArea').style.display = 'block';

                // Show preview
                showMediaPreview(mediaDataURL, type);

                // Update upload area styling
                mediaUploadArea.style.borderColor = 'var(--primary)';
                mediaUploadArea.style.borderStyle = 'solid';
            };
            reader.readAsDataURL(file);
        }

        // Click on media upload area
        mediaUploadArea.addEventListener('click', function() {
            fileInput.click();
        });

        // ===== POST STATUS =====
        function postStatus() {
            const text = statusText.value.trim();

            // Check if there's content
            if (!text && !mediaFile) {
                showMsg('⚠️ Empty Status', 'Please write something or add media to share your status.');
                return;
            }

            // Check character limit
            if (text.length > 200) {
                showMsg('⚠️ Too Long', 'Status text cannot exceed 200 characters.');
                return;
            }

            // Disable button
            postBtn.disabled = true;
            postBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sharing...';

            // Simulate posting
            setTimeout(() => {
                const visibility = document.getElementById('visibilitySelect');
                const visibilityText = visibility.options[visibility.selectedIndex].text;

                let contentPreview = text || (mediaFile ? mediaFile.name : '');
                if (mediaFile) {
                    contentPreview = mediaFile.type.startsWith('image/') ? '📸 Photo' : '🎬 Video';
                    contentPreview += `: ${mediaFile.name}`;
                }

                showMsg('✅ Status Shared', `Your status has been shared with ${visibilityText}! It will disappear in 24 hours.`);

                // Reset form
                postBtn.disabled = false;
                postBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Share Status';

                // Reset
                statusText.value = '';
                charCount.textContent = '0';
                mediaFile = null;
                mediaDataURL = null;
                fileName.textContent = '';
                document.getElementById('fileInput').value = '';
                mediaUploadArea.style.borderColor = 'var(--border-dim)';
                mediaUploadArea.style.borderStyle = 'dashed';

                // Reset preview
                selectOption('text');
                document.querySelector('.status-option[data-type="text"]').classList.add('active');
                document.querySelector('.status-option[data-type="photo"]').classList.remove('active');
                document.querySelector('.status-option[data-type="video"]').classList.remove('active');
                document.getElementById('textInputArea').style.display = 'block';
                document.getElementById('mediaUploadArea').style.display = 'none';
                previewContent.innerHTML = `
                    <div class="preview-placeholder">
                        <i class="fas fa-pen"></i>
                        Write something or add media...
                    </div>
                `;

                // Redirect after a moment
                setTimeout(() => {
                    window.location.href = 'message.html';
                }, 2500);

            }, 1500);
        }

        // ===== MESSAGE BOX =====
        function showMsg(title, text) {
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBox').style.display = 'block';
            document.getElementById('msgOverlay').style.display = 'block';
        }

        function hideMsg() {
            document.getElementById('msgBox').style.display = 'none';
            document.getElementById('msgOverlay').style.display = 'none';
        }

        // ===== KEYBOARD SHORTCUTS =====
        statusText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                postStatus();
            }
        });

        // ===== INIT =====
        console.log('📸 Create Status page loaded.');
        console.log('✏️ Type a status or upload a photo/video to share.');
        console.log('⏰ Statuses disappear after 24 hours.');
    </script>

</body>
</html>
