<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Gramite · Messages & Status</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff1a1a;
            --primary-soft: #ff0000;
            --primary-glow: rgba(255, 26, 26, 0.35);
            --online: #00cc66;
            --away: #ffaa00;
            --busy: #ff0044;
            --offline: #555;
            --dark: #0c0c10;
            --darker: #07070a;
            --card-bg: #16161e;
            --card-hover: #1f1f2a;
            --border-dim: #2a2a36;
            --text-main: #f0f0f8;
            --text-muted: #9494a3;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text-main);
            display: flex;
            background-image: radial-gradient(circle at 30% 10%, #1a0e0e 0%, #0c0c10 80%);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--darker); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 64px;
            min-width: 64px;
            background: var(--darker);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0 12px;
            border-right: 1px solid var(--border-dim);
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .sidebar .nav-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            width: 100%;
            align-items: center;
        }

        .sidebar .nav-item {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            border: none;
            background: transparent;
            font-size: 18px;
        }

        .sidebar .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .sidebar .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .sidebar .nav-item .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--primary);
            color: white;
            font-size: 8px;
            padding: 2px 5px;
            border-radius: 10px;
            font-weight: 600;
            min-width: 16px;
            text-align: center;
            line-height: 1.2;
        }

        .sidebar .bottom-nav {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            align-items: center;
        }

        /* ===== MAIN LAYOUT ===== */
        .main-container {
            margin-left: 64px;
            display: flex;
            height: 100vh;
            width: calc(100% - 64px);
            overflow: hidden;
        }

        /* ===== LEFT PANEL ===== */
        .left-panel {
            width: 340px;
            min-width: 340px;
            background: var(--darker);
            border-right: 1px solid var(--border-dim);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .panel-header {
            padding: 14px 18px 10px;
            border-bottom: 1px solid var(--border-dim);
            flex-shrink: 0;
        }

        .panel-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .panel-header p {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* ===== STATUS ROW - SCALABLE WITH HORIZONTAL SCROLL ===== */
        .status-row-wrapper {
            border-bottom: 1px solid var(--border-dim);
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            background: var(--darker);
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px 10px;
            overflow-x: auto;
            overflow-y: visible;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            min-height: 85px;
            flex-wrap: nowrap;
            cursor: grab;
            scrollbar-width: none;
        }

        .status-row::-webkit-scrollbar {
            display: none;
        }

        .status-row:active {
            cursor: grabbing;
        }

        /* Scroll shadow indicators */
        .status-row-wrapper::before,
        .status-row-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 24px;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-row-wrapper::before {
            left: 0;
            background: linear-gradient(to right, var(--darker), transparent);
        }

        .status-row-wrapper::after {
            right: 0;
            background: linear-gradient(to left, var(--darker), transparent);
        }

        .status-row-wrapper.show-left::before {
            opacity: 1;
        }

        .status-row-wrapper.show-right::after {
            opacity: 1;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            min-width: 68px;
            max-width: 76px;
            text-decoration: none;
            color: var(--text-main);
            border: none;
            background: transparent;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .status-item:hover { transform: translateY(-3px); }

        .status-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 2.5px;
            background: linear-gradient(45deg, var(--primary), #ff6b6b, var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .status-circle .inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid var(--darker);
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--primary);
            overflow: hidden;
        }

        .status-circle .inner img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-circle .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2.5px solid var(--darker);
        }

        .status-dot.online { background: var(--online); }
        .status-dot.away { background: var(--away); }
        .status-dot.busy { background: var(--busy); }
        .status-dot.offline { background: var(--offline); }

        .status-item .status-name {
            font-size: 11px;
            color: var(--text-muted);
            max-width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        .status-item .status-name.your-status {
            color: var(--primary);
            font-weight: 600;
        }

        /* ===== SEARCH ===== */
        .search-bar {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-dim);
            flex-shrink: 0;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar input:focus { border-color: var(--primary); }
        .search-bar input::placeholder { color: var(--text-muted); }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-dim);
            background: var(--darker);
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 10px 4px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
        }

        .tab:hover { color: var(--text-main); }
        .tab.active { color: var(--primary); }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }

        /* ===== CHAT LIST ===== */
        .chat-list-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        .chat-list {
            padding: 4px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            position: relative;
            min-height: 56px;
        }

        .chat-item:hover { background: rgba(255, 255, 255, 0.03); }
        .chat-item.active {
            background: rgba(255, 26, 26, 0.08);
            border-left-color: var(--primary);
        }

        .chat-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
            position: relative;
            flex-shrink: 0;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
            overflow: hidden;
        }

        .chat-item .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-item .avatar .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--darker);
        }

        .chat-item .info {
            flex: 1;
            min-width: 0;
        }

        .chat-item .info .name {
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-item .info .name .verified {
            color: var(--primary);
            font-size: 11px;
        }

        .chat-item .info .last-msg {
            color: var(--text-muted);
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item .meta {
            text-align: right;
            flex-shrink: 0;
            margin-left: 6px;
        }

        .chat-item .meta .time {
            color: var(--text-muted);
            font-size: 10px;
        }

        .chat-item .meta .unread {
            background: var(--primary);
            color: white;
            font-size: 9px;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 10px;
            margin-top: 2px;
            display: inline-block;
            min-width: 18px;
            text-align: center;
        }

        .group-avatar {
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 13px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 12px;
        }

        /* ===== CHAT WINDOW ===== */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--dark);
            height: 100vh;
            min-width: 0;
        }

        .chat-header {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--darker);
            flex-shrink: 0;
            min-height: 56px;
        }

        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .chat-header .left .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .chat-header .left .info {
            min-width: 0;
        }

        .chat-header .left .info .name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-header .left .info .status-text {
            font-size: 11px;
            color: var(--text-muted);
        }

        .chat-header .left .info .status-text.online { color: var(--online); }
        .chat-header .left .info .status-text.away { color: var(--away); }
        .chat-header .left .info .status-text.busy { color: var(--busy); }

        .chat-header .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-header .actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            transition: color 0.3s;
            padding: 4px;
            text-decoration: none;
        }

        .chat-header .actions button:hover { color: var(--text-main); }
        .chat-header .actions .call-btn:hover { color: var(--online); }
        .chat-header .actions .video-btn:hover { color: var(--online); }
        .chat-header .actions .info-btn:hover { color: var(--primary); }

        /* ===== MESSAGES ===== */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message {
            max-width: 75%;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.received {
            background: var(--card-bg);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .message.sent {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .message .time {
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            margin-top: 3px;
            display: block;
            text-align: right;
        }

        .message.received .time { color: var(--text-muted); }
        .message .sender {
            font-size: 10px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 2px;
            display: block;
        }

        /* ===== CALL OVERLAY ===== */
        .call-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 30px;
        }

        .call-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .call-overlay .call-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            object-fit: cover;
            margin-bottom: 16px;
        }

        .call-overlay .call-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .call-overlay .call-status {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .call-overlay .call-status.ringing {
            animation: pulse-text 1.5s infinite;
        }

        .call-overlay .call-status.connected {
            color: var(--online);
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .call-overlay .call-actions {
            display: flex;
            gap: 30px;
        }

        .call-overlay .call-actions button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .call-overlay .call-actions .end-call {
            background: #ff0044;
            color: white;
        }

        .call-overlay .call-actions .end-call:hover {
            transform: scale(1.1);
            background: #cc0033;
        }

        .call-overlay .call-actions .answer-call {
            background: var(--online);
            color: white;
        }

        .call-overlay .call-actions .answer-call:hover {
            transform: scale(1.1);
        }

        .call-overlay .call-actions .mute-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-dim);
        }

        .call-overlay .call-actions .mute-btn:hover {
            background: var(--card-hover);
            color: var(--text-main);
        }

        .call-overlay .call-actions .mute-btn.muted {
            background: #ff0044;
            color: white;
            border-color: #ff0044;
        }

        .call-overlay .call-actions .speaker-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-dim);
        }

        .call-overlay .call-actions .speaker-btn:hover {
            background: var(--card-hover);
            color: var(--text-main);
        }

        .call-overlay .call-actions .speaker-btn.speaker-on {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .call-overlay .call-timer {
            font-size: 32px;
            font-weight: 300;
            color: var(--text-main);
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }

        .call-overlay .call-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .call-overlay .call-close:hover {
            color: var(--text-main);
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== MESSAGE INPUT ===== */
        .message-input {
            padding: 10px 16px 12px;
            border-top: 1px solid var(--border-dim);
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--darker);
            flex-shrink: 0;
            padding-bottom: calc(12px + var(--safe-bottom));
        }

        .message-input input {
            flex: 1;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            border-radius: 20px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color 0.3s;
            min-width: 0;
        }

        .message-input input:focus { border-color: var(--primary); }
        .message-input input::placeholder { color: var(--text-muted); }

        .message-input .input-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .message-input .input-actions button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .message-input .input-actions button:hover {
            background: var(--primary);
            color: white;
        }

        .message-input .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .message-input .send-btn:hover {
            background: #e60000;
            transform: scale(1.05);
        }

        .voice-btn {
            background: var(--primary) !important;
            color: white !important;
        }

        .voice-btn:hover {
            background: #e60000 !important;
            transform: scale(1.05);
        }

        .voice-btn.recording {
            animation: pulse-rec 1s infinite;
            background: #ff4444 !important;
        }

        @keyframes pulse-rec {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ===== SETTINGS PANEL ===== */
        .settings-content {
            display: none;
            padding: 14px 16px;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
        }

        .settings-content.active { display: flex; }

        .settings-group {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid var(--border-dim);
        }

        .settings-group h4 {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            gap: 8px;
        }

        .setting-item:last-child { border-bottom: none; }

        .setting-item .label {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-item .label i { color: var(--primary); width: 18px; }

        .setting-item .toggle {
            width: 36px;
            height: 20px;
            background: var(--border-dim);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }

            document.getElementById('callName').textContent = name;
            document.getElementById('callAvatar').src = avatar;
            document.getElementById('callStatus').textContent = type === 'audio' ? 'Calling...' : 'Video calling...';
            document.getElementById('callStatus').className = 'call-status ringing';
            document.getElementById('callTimer').textContent = '00:00';
            callSeconds = 0;
            isMuted = false;
            isSpeakerOn = false;

            // Reset mute and speaker buttons
            document.getElementById('muteBtn').className = 'mute-btn';
            document.getElementById('muteBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            document.getElementById('speakerBtn').className = 'speaker-btn';
            document.getElementById('speakerBtn').innerHTML = '<i class="fas fa-volume-up"></i>';

            overlay.classList.add('active');

            // Simulate connecting
            setTimeout(() => {
                document.getElementById('callStatus').textContent = 'Connected';
                document.getElementById('callStatus').className = 'call-status connected';
                startCallTimer();
            }, 1500);
        }

        function startCallTimer() {
            if (callTimer) clearInterval(callTimer);
            callTimer = setInterval(() => {
                callSeconds++;
                const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const secs = String(callSeconds % 60).padStart(2, '0');
                document.getElementById('callTimer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function endCall() {
            const overlay = document.getElementById('callOverlay');
            overlay.classList.remove('active');
            if (callTimer) {
                clearInterval(callTimer);
                callTimer = null;
            }
            callSeconds = 0;
            showMsg('📞 Call Ended', `Call with ${document.getElementById('callName').textContent} ended.`);
        }

        function toggleMute() {
            const btn = document.getElementById('muteBtn');
            isMuted = !isMuted;
            if (isMuted) {
                btn.classList.add('muted');
                btn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
                showMsg('🔇 Muted', 'Your microphone is now muted.');
            } else {
                btn.classList.remove('muted');
                btn.innerHTML = '<i class="fas fa-microphone"></i>';
                showMsg('🎙️ Unmuted', 'Your microphone is now active.');
            }
        }

        function toggleSpeaker() {
            const btn = document.getElementById('speakerBtn');
            isSpeakerOn = !isSpeakerOn;
            if (isSpeakerOn) {
                btn.classList.add('speaker-on');
                btn.innerHTML = '<i class="fas fa-volume-up"></i>';
                showMsg('🔊 Speaker On', 'Speaker mode is now active.');
            } else {
                btn.classList.remove('speaker-on');
                btn.innerHTML = '<i class="fas fa-volume-up"></i>';
                showMsg('🔇 Speaker Off', 'Speaker mode is now off.');
            }
        }

        // Close call with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const overlay = document.getElementById('callOverlay');
                if (overlay.classList.contains('active')) {
                    endCall();
                }
            }
        });

        // ===== VOICE NOTE =====
        function toggleVoiceNote() {
            const btn = document.getElementById('voiceBtn');
            isRecording = !isRecording;
            if (isRecording) {
                btn.classList.add('recording');
                btn.innerHTML = '<i class="fas fa-stop"></i>';
                showMsg('🎙️ Recording', 'Recording voice note... Tap again to stop.');
            } else {
                btn.classList.remove('recording');
                btn.innerHTML = '<i class="fas fa-microphone"></i>';
                showMsg('✅ Voice Note', 'Voice note sent!');
            }
        }

        // ===== STATUS ROW =====
        function renderStatusRow() {
            const row = document.getElementById('statusRow');
            // Keep the Your Status link (it's already in HTML)
            let html = '';

            const statusFriends = friends.filter(f => f.hasStatus);
            statusFriends.forEach(f => {
                html += `
                    <button class="status-item" onclick="viewFriendStatus('${f.name}')">
                        <div class="status-circle" style="background: linear-gradient(45deg, var(--primary), #ff6b6b);">
                            <div class="inner"><img src="${f.avatar}" alt="${f.name}"></div>
                            <div class="status-dot ${f.status}"></div>
                        </div>
                        <span class="status-name">${f.name.split(' ')[0]}</span>
                    </button>
                `;
            });

            // Insert friend statuses after the Your Status link
            const yourStatusBtn = document.getElementById('yourStatusBtn');
            if (yourStatusBtn) {
                // Remove existing friend statuses (keep only the Your Status link)
                const existingItems = row.querySelectorAll('.status-item:not(#yourStatusBtn)');
                existingItems.forEach(el => el.remove());
                
                // Insert new friend statuses after Your Status
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = html;
                while (tempDiv.firstChild) {
                    row.appendChild(tempDiv.firstChild);
                }
            } else {
                // Fallback: just set innerHTML
                row.innerHTML = `
                    <a href="create-status.html" class="status-item" id="yourStatusBtn">
                        <div class="status-circle" style="background: linear-gradient(45deg, var(--primary), #ff6b6b);">
                            <div class="inner">
                                <i class="fas fa-plus" style="font-size:18px;color:var(--primary);"></i>
                            </div>
                        </div>
                        <span class="status-name your-status">Your Status</span>
                    </a>
                    ${html}
                `;
            }

            checkScroll();
        }

        // ===== SCROLL INDICATORS =====
        function checkScroll() {
            const wrapper = document.getElementById('statusRowWrapper');
            const row = document.getElementById('statusRow');
            const hint = document.getElementById('scrollHint');

            if (!row) return;

            const canScrollRight = row.scrollWidth > row.clientWidth;
            const isAtStart = row.scrollLeft === 0;
            const isAtEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 2;

            wrapper.classList.toggle('show-left', !isAtStart);
            wrapper.classList.toggle('show-right', !isAtEnd && canScrollRight);

            if (hint) {
                hint.style.display = (canScrollRight && isAtStart) ? 'block' : 'none';
            }
        }

        // ===== DRAG TO SCROLL =====
        let isDragging = false;
        let startX = 0;
        let scrollLeft = 0;

        const statusRow = document.getElementById('statusRow');

        statusRow.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.pageX - statusRow.offsetLeft;
            scrollLeft = statusRow.scrollLeft;
            statusRow.style.cursor = 'grabbing';
        });

        statusRow.addEventListener('mouseleave', () => {
            isDragging = false;
            statusRow.style.cursor = 'grab';
        });

        statusRow.addEventListener('mouseup', () => {
            isDragging = false;
            statusRow.style.cursor = 'grab';
        });

        statusRow.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - statusRow.offsetLeft;
            const walk = (x - startX) * 1.5;
            statusRow.scrollLeft = scrollLeft - walk;
        });

        statusRow.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].pageX - statusRow.offsetLeft;
            scrollLeft = statusRow.scrollLeft;
        });

        statusRow.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const x = e.touches[0].pageX - statusRow.offsetLeft;
            const walk = (x - startX) * 1.5;
            statusRow.scrollLeft = scrollLeft - walk;
        });

        statusRow.addEventListener('touchend', () => {
            isDragging = false;
        });

        statusRow.addEventListener('scroll', checkScroll);

        // ===== STATUS MODAL - REMOVED =====
        // The modal is removed since we now link to create-status.html

        function viewFriendStatus(name) {
            showMsg('📸 ' + name + '\'s Status', 'This status will disappear in 24 hours. Tap to view full story.');
        }

        // ===== RENDER FUNCTIONS =====
        function renderFriends() {
            const list = document.getElementById('friendsList');
            list.innerHTML = friends.map(f => `
                <div class="chat-item ${f.id === currentChatId && currentChatType === 'friend' ? 'active' : ''}" data-id="${f.id}" data-type="friend" onclick="openChat(${f.id}, 'friend')">
                    <div class="avatar">
                        <img src="${f.avatar}" alt="${f.name}">
                        <div class="status-dot ${f.status}"></div>
                    </div>
                    <div class="info">
                        <div class="name">${f.name}</div>
                        <div class="last-msg">${f.lastMsg}</div>
                    </div>
                    <div class="meta">
                        <div class="time">${f.time}</div>
                        ${f.unread > 0 ? `<div class="unread">${f.unread}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderGroups() {
            const list = document.getElementById('groupsList');
            list.innerHTML = groups.map(g => `
                <div class="chat-item ${g.id === currentChatId && currentChatType === 'group' ? 'active' : ''}" data-id="${g.id}" data-type="group" onclick="openChat(${g.id}, 'group')">
                    <div class="group-avatar">${g.avatar}</div>
                    <div class="info">
                        <div class="name">${g.name} <span style="font-size:10px;color:var(--text-muted);font-weight:400;">${g.members} members</span></div>
                        <div class="last-msg">${g.lastMsg}</div>
                    </div>
                    <div class="meta">
                        <div class="time">${g.time}</div>
                        ${g.unread > 0 ? `<div class="unread">${g.unread}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderMessages(chatId, type) {
            const area = document.getElementById('messagesArea');
            let msgs = [];
            if (type === 'friend') {
                const friend = friends.find(f => f.id === chatId);
                if (friend) {
                    document.getElementById('chatName').textContent = friend.name;
                    document.getElementById('chatAvatar').src = friend.avatar;
                    const statusText = document.getElementById('chatStatus');
                    statusText.textContent = friend.status.charAt(0).toUpperCase() + friend.status.slice(1);
                    statusText.className = `status-text ${friend.status}`;
                }
                msgs = messages[chatId] || [
                    { sender: friend?.name || 'User', text: 'Start a conversation!', time: 'Now', type: 'received' }
                ];
            } else {
                const group = groups.find(g => g.id === chatId);
                if (group) {
                    document.getElementById('chatName').textContent = group.name;
                    document.getElementById('chatAvatar').src = 'https://placehold.co/40x40/ff0050/white?text=' + group.avatar;
                    document.getElementById('chatStatus').textContent = `${group.members} members`;
                    document.getElementById('chatStatus').className = 'status-text';
                }
                msgs = [
                    { sender: 'Alice', text: 'Hello everyone!', time: '10:00 AM', type: 'received' },
                    { sender: 'You', text: 'Hi Alice!', time: '10:05 AM', type: 'sent' },
                    { sender: 'Bob', text: 'Hey all!', time: '10:10 AM', type: 'received' },
                ];
            }

            area.innerHTML = msgs.map(m => `
                <div class="message ${m.type}">
                    ${m.sender && m.type === 'received' ? `<span class="sender">${m.sender}</span>` : ''}
                    ${m.text}
                    <span class="time">${m.time}</span>
                </div>
            `).join('');
            area.scrollTop = area.scrollHeight;
        }

        function openChat(id, type) {
            currentChatId = id;
            currentChatType = type;
            renderFriends();
            renderGroups();
            renderMessages(id, type);
            if (window.innerWidth <= 600) {
                document.getElementById('leftPanel').classList.remove('mobile-active');
            }
        }

        // ===== TAB SWITCHING =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');

                const target = this.dataset.tab;
                const friendsContainer = document.querySelector('.chat-list-container');
                const groupsContainer = document.getElementById('groupsContainer');
                const settingsPanel = document.getElementById('settingsPanel');

                if (target === 'friends') {
                    friendsContainer.style.display = 'block';
                    groupsContainer.style.display = 'none';
                    settingsPanel.classList.remove('active');
                } else if (target === 'groups') {
                    friendsContainer.style.display = 'none';
                    groupsContainer.style.display = 'block';
                    settingsPanel.classList.remove('active');
                } else if (target === 'settings') {
                    friendsContainer.style.display = 'none';
                    groupsContainer.style.display = 'none';
                    settingsPanel.classList.add('active');
                }
            });
        });

        // ===== SEND MESSAGE =====
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const area = document.getElementById('messagesArea');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message sent';
            msgDiv.innerHTML = `${text}<span class="time">${time}</span>`;
            area.appendChild(msgDiv);
            area.scrollTop = area.scrollHeight;
            input.value = '';

            setTimeout(() => {
                const reply = document.createElement('div');
                reply.className = 'message received';
                const sender = currentChatType === 'friend' 
                    ? friends.find(f => f.id === currentChatId)?.name || 'Friend'
                    : 'Group Member';
                reply.innerHTML = `<span class="sender">${sender}</span>That's great!<span class="time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
                area.appendChild(reply);
                area.scrollTop = area.scrollHeight;
            }, 1000 + Math.random() * 2000);
        }

        // ===== SEARCH =====
        document.getElementById('searchInput').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#friendsList .chat-item').forEach(item => {
                const name = item.querySelector('.name')?.textContent?.toLowerCase() || '';
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
            document.querySelectorAll('#groupsList .chat-item').forEach(item => {
                const name = item.querySelector('.name')?.textContent?.toLowerCase() || '';
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        });

        // ===== MOBILE BACK =====
        document.getElementById('mobileBack').addEventListener('click', function() {
            document.getElementById('leftPanel').classList.toggle('mobile-active');
        });

        // ===== STATUS CHANGE =====
        document.getElementById('statusSelect').addEventListener('change', function() {
            const status = this.value;
            const statusText = document.getElementById('chatStatus');
            statusText.textContent = status.charAt(0).toUpperCase() + status.slice(1);
            statusText.className = `status-text ${status}`;
            
            const friend = friends.find(f => f.id === currentChatId);
            if (friend && currentChatType === 'friend') {
                friend.status = status;
                renderFriends();
                renderStatusRow();
            }
        });

        // ===== MESSAGE BOX =====
        function showMsg(title, text) {
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgBox').style.display = 'block';
            document.getElementById('msgOverlay').style.display = 'block';
        }

        function hideMsg() {
            document.getElementById('msgBox').style.display = 'none';
            document.getElementById('msgOverlay').style.display = 'none';
        }

        // ===== RESIZE HANDLER =====
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (window.innerWidth > 600) {
                    document.getElementById('leftPanel').classList.remove('mobile-active');
                }
                checkScroll();
            }, 200);
        });

        // ===== NAVIGATION INTERCEPT =====
        document.querySelectorAll('.nav-item, .sidebar .nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#')) {
                    e.preventDefault();
                    showMsg('🚀 Navigating', `Going to ${this.querySelector('span')?.textContent || 'page'}...`);
                    setTimeout(() => {
                        window.location.href = href;
                    }, 400);
                }
            });
        });

        // ===== INIT =====
        renderStatusRow();
        renderFriends();
        renderGroups();
        renderMessages(1, 'friend');

        if (window.innerWidth <= 600) {
            document.getElementById('leftPanel').classList.add('mobile-active');
        }

        setTimeout(checkScroll, 100);

        console.log('📱 Messages & Status page loaded with linkable Create Status.');
        console.log('➕ Click "Your Status" to go to create-status.html');
        console.log('📞 Click the phone or video icon to call the current contact.');
    </script>

</body>
</html>
