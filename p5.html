<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Camera Page</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container for the camera and controls */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            background-color: #222;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        /* Video feed from the camera */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Capture button */
        .capture-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff3b3f;
            color: white;
            font-size: 24px;
            border: none;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease;
            width: 50px;
            height: 50px;
        }

        .capture-btn:hover {
            background-color: #ff2a2d;
        }

        .capture-btn:active {
            background-color: red;
        }

        /* Captured photo preview */
        .photo-preview {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 100%;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .photo-preview img {
            width: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        /* Style for the camera footer (optional) */
        .camera-footer {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #fff;
        }

        .camera-footer span {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Camera Container -->
    <div class="camera-container">
        <!-- Live video feed -->
        <video id="video" autoplay></video>
     <div class="box">
        <!-- Capture button -->
        <button class="capture-btn" id="capture-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
          </svg></button>

        <!-- Photo Preview (hidden by default) -->
        <div class="photo-preview" id="photo-preview">
            <img id="captured-photo" alt="Captured Photo">
        </div>
     </div>
        <!-- Camera Footer -->
        <div class="camera-footer">
            <span>Press 📸 to Capture</span>
        </div>
    </div>

    <script>
        // Get references to DOM elements
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture-btn');
        const photoPreview = document.getElementById('photo-preview');
        const capturedPhoto = document.getElementById('captured-photo');

        // Access the camera using getUserMedia API
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });
                video.srcObject = stream;
            } catch (error) {
                alert("Error accessing the camera: " + error.message);
            }
        }

        // Capture photo when the capture button is clicked
        captureBtn.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Draw the current frame from the video feed onto the canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert the canvas to an image URL
            const imageData = canvas.toDataURL('image/png');

            // Display the captured photo in the preview section
            capturedPhoto.src = imageData;
            photoPreview.style.display = 'flex';

            // Hide the photo preview after 3 seconds
            setTimeout(() => {
                photoPreview.style.display = 'none';
            }, 3000);
        });

        // Start the camera when the page loads
        startCamera();
    </script>

</body>
</html>
