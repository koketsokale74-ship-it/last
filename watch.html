
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch · Gramite</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0000;
            --primary-dark: #ff0000;
            --dark: #121212;
            --darker: #0a0a0a;
            --light: #f8f8f8;
            --gray: #808080;
            --dark-gray: #2e2e2e;
            --card-bg: #1a1a1a;
            --card-border: #333333;
            --success: #00ff88;
            --font-family: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--darker);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 72px;
            background: var(--darker);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            border-right: 1px solid var(--dark-gray);
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        .sidebar .nav-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .sidebar .nav-item {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .sidebar .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--light);
        }

        .sidebar .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .sidebar .nav-item i {
            font-size: 20px;
        }

        .sidebar .nav-item .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--primary);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }

        .sidebar .bottom-nav {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-container {
            margin-left: 72px;
            flex: 1;
            padding: 30px 40px;
            max-width: calc(100% - 72px);
            overflow-y: auto;
            height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .page-header .subtitle {
            color: var(--gray);
            font-size: 14px;
        }

        .upload-btn {
            padding: 10px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: var(--font-family);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 80, 0.3);
        }

        /* ===== CATEGORIES ===== */
        .categories-scroll {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--gray);
            font-family: var(--font-family);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .category-btn:hover {
            border-color: var(--primary);
            color: var(--light);
        }

        .category-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* ===== FEATURED ===== */
        .featured-section {
            margin-bottom: 35px;
        }

        .featured-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .featured-section .section-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .featured-section .section-header .see-all {
            color: var(--gray);
            font-size: 13px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .featured-section .section-header .see-all:hover {
            color: var(--primary);
        }

        .featured-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* ===== VIDEO CARD ===== */
        .video-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(255, 0, 80, 0.1);
        }

        .video-card .thumbnail {
            position: relative;
            height: 160px;
            background: var(--darker);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-card .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-card .thumbnail .play-icon {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 0, 80, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .video-card:hover .thumbnail .play-icon {
            transform: scale(1.15);
            background: var(--primary);
        }

        .video-card .thumbnail .play-icon i {
            color: white;
            font-size: 20px;
            margin-left: 4px;
        }

        .video-card .thumbnail .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.8);
            font-size: 12px;
            font-weight: 600;
        }

        .video-card .thumbnail .views {
            position: absolute;
            bottom: 8px;
            left: 8px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.8);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .video-card .body {
            padding: 14px 16px 16px;
        }

        .video-card .body .video-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-card .body .channel-name {
            color: var(--gray);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .video-card .body .video-meta {
            display: flex;
            gap: 12px;
            color: var(--gray);
            font-size: 12px;
        }

        .video-card .body .video-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== TRENDING ===== */
        .trending-section {
            margin-top: 10px;
        }

        .trending-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .trending-section .section-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .main-container {
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar .logo {
                font-size: 18px;
            }
            .sidebar .nav-item {
                width: 40px;
                height: 40px;
            }
            .sidebar .nav-item i {
                font-size: 17px;
            }
            .main-container {
                margin-left: 60px;
                max-width: calc(100% - 60px);
                padding: 16px;
            }
            .page-header h1 {
                font-size: 22px;
            }
            .featured-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 14px;
            }
            .video-card .thumbnail {
                height: 130px;
            }
            .categories-scroll {
                gap: 6px;
            }
            .category-btn {
                padding: 6px 14px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .upload-btn {
                width: 100%;
                justify-content: center;
            }
            .featured-grid {
                grid-template-columns: 1fr;
            }
            .video-card .thumbnail {
                height: 180px;
            }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 1001;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            color: var(--success);
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="logo">G</div>
        <div class="nav-items">
            <div class="nav-item" onclick="window.location.href='Home.html'">
                <i class="fas fa-home"></i>
            </div>
            <div class="nav-item" onclick="window.location.href='chating.html'">
                <i class="fas fa-comment-dots"></i>
                <span class="badge">12</span>
            </div>
            <div class="nav-item" onclick="window.location.href='groups.html'">
                <i class="fas fa-users"></i>
                <span class="badge">8</span>
            </div>
            <div class="nav-item active" onclick="window.location.href='watch.html'">
                <i class="fas fa-play-circle"></i>
            </div>
            <div class="nav-item" onclick="window.location.href='notification.html'">
                <i class="fas fa-bell"></i>
                <span class="badge">3</span>
            </div>
        </div>
        <div class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='settings.html'">
                <i class="fas fa-cog"></i>
            </div>
            <div class="nav-item" onclick="window.location.href='menu.html'">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-container">
        <div class="page-header">
            <div>
                <h1>Watch</h1>
                <div class="subtitle">Discover trending videos and connect with creators</div>
            </div>
            <button class="upload-btn" onclick="uploadVideo()">
                <i class="fas fa-upload"></i> Upload Video
            </button>
        </div>

        <!-- Categories -->
        <div class="categories-scroll" id="categoriesScroll">
            <button class="category-btn active" data-category="all" onclick="filterCategory('all')">All</button>
            <button class="category-btn" data-category="trending" onclick="filterCategory('trending')">🔥 Trending</button>
            <button class="category-btn" data-category="gaming" onclick="filterCategory('gaming')">🎮 Gaming</button>
            <button class="category-btn" data-category="music" onclick="filterCategory('music')">🎵 Music</button>
            <button class="category-btn" data-category="tech" onclick="filterCategory('tech')">💻 Tech</button>
            <button class="category-btn" data-category="lifestyle" onclick="filterCategory('lifestyle')">🌟 Lifestyle</button>
            <button class="category-btn" data-category="comedy" onclick="filterCategory('comedy')">😂 Comedy</button>
            <button class="category-btn" data-category="education" onclick="filterCategory('education')">📚 Education</button>
            <button class="category-btn" data-category="sports" onclick="filterCategory('sports')">⚽ Sports</button>
        </div>

        <!-- Featured Section -->
        <div class="featured-section">
            <div class="section-header">
                <h2><i class="fas fa-fire" style="color:var(--primary);"></i> Featured Videos</h2>
                <span class="see-all" onclick="showToast('Loading more featured videos...')">See All →</span>
            </div>
            <div class="featured-grid" id="featuredGrid">
                <!-- Videos rendered by JavaScript -->
            </div>
        </div>

        <!-- Trending Section -->
        <div class="trending-section">
            <div class="section-header">
                <h2><i class="fas fa-chart-line" style="color:var(--primary);"></i> Trending Now</h2>
                <span class="see-all" onclick="showToast('Loading more trending videos...')">See All →</span>
            </div>
            <div class="featured-grid" id="trendingGrid">
                <!-- Trending videos rendered by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Action completed successfully!</span>
    </div>

    <script>
        // ===== VIDEO DATA =====
        const videos = [
            {
                id: 1,
                title: "The Future of AI: 2026 Predictions",
                channel: "TechInsights",
                channelAvatar: "TI",
                views: "2.4M",
                duration: "12:34",
                category: "tech",
                trending: true,
                featured: true,
                thumbnail: "🤖",
                color: "#00aaff"
            },
            {
                id: 2,
                title: "Ultimate Gaming Setup Tour 2026",
                channel: "GameMaster",
                channelAvatar: "GM",
                views: "1.8M",
                duration: "18:20",
                category: "gaming",
                trending: true,
                featured: true,
                thumbnail: "🎮",
                color: "#ff44aa"
            },
            {
                id: 3,
                title: "Live Concert: Electric Dreams Festival",
                channel: "MusicLive",
                channelAvatar: "ML",
                views: "3.2M",
                duration: "45:00",
                category: "music",
                trending: true,
                featured: true,
                thumbnail: "🎵",
                color: "#00ff88"
            },
            {
                id: 4,
                title: "10 Life Hacks That Actually Work",
                channel: "LifeHacks",
                channelAvatar: "LH",
                views: "5.6M",
                duration: "08:15",
                category: "lifestyle",
                trending: false,
                featured: true,
                thumbnail: "💡",
                color: "#ffaa00"
            },
            {
                id: 5,
                title: "Funniest Moments 2026 Compilation",
                channel: "ComedyCentral",
                channelAvatar: "CC",
                views: "4.7M",
                duration: "15:42",
                category: "comedy",
                trending: true,
                featured: true,
                thumbnail: "😂",
                color: "#ff6633"
            },
            {
                id: 6,
                title: "Learn Python in 30 Minutes",
                channel: "CodeWithMe",
                channelAvatar: "CWM",
                views: "890K",
                duration: "30:00",
                category: "education",
                trending: false,
                featured: true,
                thumbnail: "🐍",
                color: "#33cc99"
            },
            {
                id: 7,
                title: "World Cup Highlights: Final Match",
                channel: "SportsCentral",
                channelAvatar: "SC",
                views: "8.9M",
                duration: "22:10",
                category: "sports",
                trending: true,
                featured: false,
                thumbnail: "⚽",
                color: "#00ff88"
            },
            {
                id: 8,
                title: "Building a Smart Home from Scratch",
                channel: "TechDIY",
                channelAvatar: "TD",
                views: "1.2M",
                duration: "25:00",
                category: "tech",
                trending: false,
                featured: false,
                thumbnail: "🏠",
                color: "#ff0050"
            },
            {
                id: 9,
                title: "Epic Rap Battles: 2026 Edition",
                channel: "RapStar",
                channelAvatar: "RS",
                views: "3.4M",
                duration: "06:30",
                category: "music",
                trending: false,
                featured: false,
                thumbnail: "🎤",
                color: "#aa66ff"
            },
            {
                id: 10,
                title: "Mastering Digital Art in Photoshop",
                channel: "ArtPro",
                channelAvatar: "AP",
                views: "560K",
                duration: "20:00",
                category: "lifestyle",
                trending: false,
                featured: false,
                thumbnail: "🎨",
                color: "#ff44aa"
            },
            {
                id: 11,
                title: "Gaming Marathon: 24 Hours Live",
                channel: "GameMaster",
                channelAvatar: "GM",
                views: "2.1M",
                duration: "24:00:00",
                category: "gaming",
                trending: true,
                featured: false,
                thumbnail: "🎯",
                color: "#00aaff"
            },
            {
                id: 12,
                title: "Quantum Computing Explained Simply",
                channel: "ScienceNow",
                channelAvatar: "SN",
                views: "780K",
                duration: "14:20",
                category: "education",
                trending: false,
                featured: false,
                thumbnail: "⚛️",
                color: "#ffaa00"
            }
        ];

        let currentCategory = 'all';

        // ===== RENDER VIDEOS =====
        function renderVideos() {
            const featuredGrid = document.getElementById('featuredGrid');
            const trendingGrid = document.getElementById('trendingGrid');

            // Filter by category
            let filtered = videos;
            if (currentCategory !== 'all') {
                filtered = filtered.filter(v => v.category === currentCategory);
            }

            // Featured videos
            const featured = filtered.filter(v => v.featured === true);
            featuredGrid.innerHTML = featured.map(v => createVideoCard(v)).join('');

            // Trending videos (exclude featured ones if they're already shown)
            const trending = filtered.filter(v => v.trending === true && v.featured !== true);
            if (trending.length > 0) {
                trendingGrid.innerHTML = trending.map(v => createVideoCard(v)).join('');
                document.querySelector('.trending-section').style.display = 'block';
            } else {
                // Show some other videos if no trending
                const others = filtered.filter(v => v.featured !== true).slice(0, 4);
                trendingGrid.innerHTML = others.map(v => createVideoCard(v)).join('');
                if (others.length === 0) {
                    trendingGrid.innerHTML = `
                        <div style="grid-column:1/-1;text-align:center;color:var(--gray);padding:40px;">
                            <i class="fas fa-video-slash" style="font-size:32px;display:block;margin-bottom:12px;"></i>
                            <p>No videos found in this category</p>
                        </div>
                    `;
                }
            }
        }

        function createVideoCard(video) {
            return `
                <div class="video-card" onclick="playVideo(${video.id})">
                    <div class="thumbnail" style="background: linear-gradient(135deg, ${video.color}33, ${video.color});">
                        <span style="font-size:48px;">${video.thumbnail}</span>
                        <div class="play-icon"><i class="fas fa-play"></i></div>
                        <span class="duration">${video.duration}</span>
                        <span class="views"><i class="fas fa-eye"></i> ${video.views}</span>
                    </div>
                    <div class="body">
                        <div class="video-title">${video.title}</div>
                        <div class="channel-name"><i class="fas fa-user-circle"></i> ${video.channel}</div>
                        <div class="video-meta">
                            <span><i class="fas fa-eye"></i> ${video.views}</span>
                            <span><i class="fas fa-tag"></i> ${video.category}</span>
                            ${video.trending ? '<span style="color:var(--primary);"><i class="fas fa-fire"></i> Trending</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== CATEGORY FILTER =====
        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            renderVideos();
            
            // Scroll to top of video section
            document.querySelector('.featured-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ===== PLAY VIDEO =====
        function playVideo(id) {
            const video = videos.find(v => v.id === id);
            if (video) {
                showToast(`▶️ Now playing: "${video.title}" by ${video.channel}`);
            }
        }

        // ===== UPLOAD VIDEO =====
        function uploadVideo() {
            showToast('📤 Upload dialog would open here. Choose a video to share with the community!');
        }

        // ===== TOAST =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== INIT =====
        renderVideos();

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'u' || e.key === 'U') {
                if (!e.ctrlKey && !e.metaKey) {
                    uploadVideo();
                }
            }
        });
    </script>

</body>
</html>
